name: CI

on:
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - "infra/**"
      - "docs/**"
      - "**.md"

# 동일 PR에서 새 푸시 시 이전 실행 취소
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest # Docker 제공 → Testcontainers 동작
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless check
        run: ./gradlew spotlessCheck

      - name: Build & test
        run: ./gradlew build
