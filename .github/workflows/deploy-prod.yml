name: Deploy (prod)

# main 머지(push) → ECR 푸시(커밋 SHA 태그) → 태스크 정의 새 리비전 등록 → ECS 배포.

# Checkout → JDK 21 → Gradle → bootJar
#  → AWS OIDC → ECR 로그인 → 이미지 빌드·푸시
#  → 현재 태스크 정의 조회 → 이미지 교체 → 새 리비전 등록·배포
#  → 헬스체크
on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

# 동시 배포 방지.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write # OIDC 토큰 발급
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: hanspoon-prod-backend
  ECS_CLUSTER: hanspoon-prod-cluster
  ECS_SERVICE: hanspoon-prod-app
  DEPLOY_LOCK_TABLE: hanspoon-prod-deploy-lock
  CONTAINER_NAME: backend
  HEALTH_URL: https://api.han-spoon.site/actuator/health

jobs:
  deploy:
    # ARM64 native runner.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # main CI와 배포가 동시에 시작될 수 있으므로 배포 워크플로도 품질 게이트를 통과해야 한다.
      - name: Verify and build jar
        run: ./gradlew spotlessCheck test bootJar

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build and push Docker image to ECR
      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG="${GITHUB_SHA::12}"
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$TAG"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "image already exists — skip build/push"
          else
            docker build -f docker/Dockerfile -t "$IMAGE" .
            docker push "$IMAGE"
          fi
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      # backend/ai 저장소가 같은 ECS 태스크 정의를 동시에 덮어쓰지 않도록 AWS에서 직렬화.
      - name: Acquire ECS deploy lock
        id: deploy-lock
        env:
          LOCK_OWNER: ${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          LOCK_ERROR_FILE="$RUNNER_TEMP/deploy-lock-error.log"
          for i in $(seq 1 60); do
            NOW="$(date +%s)"
            EXPIRES_AT="$((NOW + 900))"
            ITEM="$(jq -nc \
              --arg owner "$LOCK_OWNER" \
              --argjson expires "$EXPIRES_AT" \
              '{lock_name:{S:"prod-ecs"},owner:{S:$owner},expires_at:{N:($expires|tostring)}}')"
            VALUES="$(jq -nc --argjson now "$NOW" '{":now":{N:($now|tostring)}}')"

            if aws dynamodb put-item \
              --table-name "$DEPLOY_LOCK_TABLE" \
              --item "$ITEM" \
              --condition-expression 'attribute_not_exists(#lock) OR #expires < :now' \
              --expression-attribute-names '{"#lock":"lock_name","#expires":"expires_at"}' \
              --expression-attribute-values "$VALUES" \
              2>"$LOCK_ERROR_FILE"; then
              echo "owner=$LOCK_OWNER" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if ! grep -q 'ConditionalCheckFailedException' "$LOCK_ERROR_FILE"; then
              echo "Failed to acquire ECS deploy lock:"
              sed -n '1,20p' "$LOCK_ERROR_FILE"
              exit 1
            fi

            echo "Another ECS deployment owns the lock... ($i/60)"
            sleep 5
          done
          echo "Timed out waiting for ECS deploy lock"
          exit 1

      # Deploy to ECS
      # 패밀리의 최신 리비전이 아니라, 현재 서비스에 지정된 정확한 리비전을 기준으로 배포.
      - name: Resolve deployed task definition
        id: current-task
        run: |
          TASK_DEFINITION_ARN="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0].taskDefinition' \
              --output text
          )"

          if [ -z "$TASK_DEFINITION_ARN" ] || [ "$TASK_DEFINITION_ARN" = "None" ]; then
            echo "Failed to resolve the task definition used by ECS service: $ECS_SERVICE"
            exit 1
          fi

          echo "Using deployed task definition: $TASK_DEFINITION_ARN"
          echo "arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"

      - name: Render task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-arn: ${{ steps.current-task.outputs.arn }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}
          environment-variables: |
            AI_SERVICE_CONNECT_TIMEOUT=500ms
            AI_OCR_READ_TIMEOUT=18s
            AI_RULE_ENGINE_READ_TIMEOUT=2s
            AI_RESULT_READ_TIMEOUT=7s
            AI_OCR_PRESIGNED_FALLBACK_ENABLED=false
            SCAN_ASYNC_CORE_POOL_SIZE=2
            SCAN_ASYNC_MAX_POOL_SIZE=2
            SCAN_ASYNC_QUEUE_CAPACITY=0
            SCAN_STALE_AFTER=2m
            SCAN_RECOVERY_INTERVAL_MS=60000

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # 인스턴스 1대 + network_mode host: 교체형 배포. 30~60초 다운타임 후 복귀.
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$HEALTH_URL" > /dev/null; then
              echo "healthy"
              exit 0
            fi
            echo "waiting... ($i/30)"
            sleep 10
          done
          echo "health check failed"
          exit 1

      - name: Release ECS deploy lock
        if: ${{ always() && steps.deploy-lock.outcome == 'success' }}
        env:
          LOCK_OWNER: ${{ steps.deploy-lock.outputs.owner }}
        run: |
          VALUES="$(jq -nc --arg owner "$LOCK_OWNER" '{":owner":{S:$owner}}')"
          aws dynamodb delete-item \
            --table-name "$DEPLOY_LOCK_TABLE" \
            --key '{"lock_name":{"S":"prod-ecs"}}' \
            --condition-expression '#owner = :owner' \
            --expression-attribute-names '{"#owner":"owner"}' \
            --expression-attribute-values "$VALUES" || true
