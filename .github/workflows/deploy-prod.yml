name: Deploy (prod)

# main 머지(push) → ECR 푸시(커밋 SHA 태그) → 태스크 정의 새 리비전 등록 → ECS 배포.

# Checkout → JDK 21 → Gradle → bootJar
#  → AWS OIDC → ECR 로그인 → 이미지 빌드·푸시
#  → 현재 태스크 정의 조회 → 이미지 교체 → 새 리비전 등록·배포
#  → 헬스체크
on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

# 동시 배포 방지.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write # OIDC 토큰 발급
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: hanspoon-prod-backend
  ECS_CLUSTER: hanspoon-prod-cluster
  ECS_SERVICE: hanspoon-prod-app
  TASK_FAMILY: hanspoon-prod-app
  CONTAINER_NAME: backend
  HEALTH_URL: https://api.han-spoon.site/actuator/health

jobs:
  deploy:
    # ARM64 native runner.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: ./gradlew bootJar -x test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build and push Docker image to ECR
      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::12}"
          docker build -f docker/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      # Deploy to ECS
      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition | {
              family: family,
              taskRoleArn: taskRoleArn,
              executionRoleArn: executionRoleArn,
              networkMode: networkMode,
              containerDefinitions: containerDefinitions,
              requiresCompatibilities: requiresCompatibilities,
              cpu: cpu,
              memory: memory,
              runtimePlatform: runtimePlatform
            }' > task-definition.json

      - name: Render task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # 인스턴스 1대 + network_mode host: 교체형 배포. 30~60초 다운타임 후 복귀.
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$HEALTH_URL" > /dev/null; then
              echo "healthy"
              exit 0
            fi
            echo "waiting... ($i/30)"
            sleep 10
          done
          echo "health check failed"
          exit 1
