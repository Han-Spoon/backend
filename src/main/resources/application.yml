spring:
  application:
    name: backend-api
  profiles:
    default: local
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  scan-async:
    core-pool-size: ${SCAN_ASYNC_CORE_POOL_SIZE:2}
    max-pool-size: ${SCAN_ASYNC_MAX_POOL_SIZE:2}
    queue-capacity: ${SCAN_ASYNC_QUEUE_CAPACITY:0}
  scan-recovery:
    stale-after: ${SCAN_STALE_AFTER:2m}
    interval-ms: ${SCAN_RECOVERY_INTERVAL_MS:60000}
  cache:
    maximum-size: ${CACHE_MAXIMUM_SIZE:10000}
    expire-after-write: ${CACHE_EXPIRE_AFTER_WRITE:10m}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rest-client:
    connect-timeout: ${REST_CLIENT_CONNECT_TIMEOUT:3s}
    read-timeout: ${REST_CLIENT_READ_TIMEOUT:10s}
  ratelimit:
    openai:
      capacity: ${OPENAI_RATE_LIMIT_CAPACITY:30}
      refill-period: ${OPENAI_RATE_LIMIT_REFILL_PERIOD:1m}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    connect-timeout: ${AI_SERVICE_CONNECT_TIMEOUT:500ms}
    ocr-read-timeout: ${AI_OCR_READ_TIMEOUT:18s}
    rule-engine-read-timeout: ${AI_RULE_ENGINE_READ_TIMEOUT:2s}
    result-read-timeout: ${AI_RESULT_READ_TIMEOUT:7s}
    # 로컬/전환 환경만 URL fallback을 사용하고 운영 프로필에서는 끈다.
    presigned-url-fallback-enabled: ${AI_OCR_PRESIGNED_FALLBACK_ENABLED:true}
  s3:
    bucket: ${S3_BUCKET:hanspoon-local-images}
    region: ${AWS_REGION:ap-northeast-2}
    endpoint: ${S3_ENDPOINT:}
    upload-url-ttl: ${S3_UPLOAD_URL_TTL:10m}
    read-url-ttl: ${S3_READ_URL_TTL:15m}
    max-file-size: ${S3_MAX_FILE_SIZE:10485760} # 10MB
  security:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
    jwt:
      issuer: han-spoon
      secret: ${JWT_SECRET:han-spoon-local-development-secret-key-must-be-at-least-32-bytes}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:30m}
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}
