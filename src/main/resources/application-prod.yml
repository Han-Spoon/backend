spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME:hanspoon}?sslmode=require
    username: ${DB_USERNAME:hanspoon_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 3000
      validation-timeout: 2000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      jakarta:
        persistence:
          database-product-name: PostgreSQL
          database-major-version: ${POSTGRES_MAJOR_VERSION:16}
          database-minor-version: ${POSTGRES_MINOR_VERSION:0}
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://han-spoon.site,https://www.han-spoon.site}
  s3:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
  security:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
    jwt:
      issuer: ${JWT_ISSUER:https://api.han-spoon.site}
      secret: ${JWT_SECRET}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:15m}
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}

logging:
  level:
    root: info
    com.hanspoon.backend_api: info
    org.hibernate.SQL: warn
    org.springframework.security: warn
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level trace=%X{traceId:-} span=%X{spanId:-} [%thread] %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}
  api-docs:
    enabled: ${OPENAPI_DOCS_ENABLED:false}