spring:
  config:
    activate:
      on-profile: prod
    import: optional:azure-keyvault:${AZURE_KEYVAULT_ENDPOINT:https://kv-hanspoon-prod.vault.azure.net/}
  cloud:
    azure:
      keyvault:
        secret:
          endpoint: ${AZURE_KEYVAULT_ENDPOINT:https://kv-hanspoon-prod.vault.azure.net/}
  datasource:
    url: ${DB_PRIVATE_ENDPOINT_URL:jdbc:postgresql://psql-hanspoon-prod.privatelink.postgres.database.azure.com:5432/hanspoon?sslmode=require}
    username: ${DB_USERNAME:hanspoon_app}
    password: ${kv-secret-db-password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 3000
      validation-timeout: 2000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      jakarta:
        persistence:
          database-product-name: PostgreSQL
          database-major-version: ${POSTGRES_MAJOR_VERSION:16}
          database-minor-version: ${POSTGRES_MINOR_VERSION:0}
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://han-spoon.vercel.app,https://www.han-spoon.com}
  azure-ai:
    endpoint: ${AZURE_AI_PRIVATE_ENDPOINT:https://aoai-hanspoon-prod.openai.azure.com}
    api-key: ${kv-secret-azure-openai-api-key:}
  security:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
    jwt:
      issuer: ${JWT_ISSUER:https://api.han-spoon.com}
      secret: ${kv-secret-jwt-signing-key}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:15m}
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}

logging:
  level:
    root: info
    com.hanspoon.backend_api: info
    org.hibernate.SQL: warn
    org.springframework.security: warn
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level trace=%X{traceId:-} span=%X{spanId:-} [%thread] %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}
  api-docs:
    enabled: ${OPENAPI_DOCS_ENABLED:false}
